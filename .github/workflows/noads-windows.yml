name: Build no-ads Windows packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.arch }} no-ads package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - 386
          - amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler zip
          corepack enable
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build no-ads package
        run: task build:windows:${{ matrix.arch }}:noads

      - name: Verify package
        shell: bash
        run: |
          archive="bin/windows-${{ matrix.arch }}-noads.zip"
          test -s "$archive"
          unzip -l "$archive"

      - name: Upload no-ads artifact
        uses: actions/upload-artifact@v4
        with:
          name: noads-windows-${{ matrix.arch }}
          path: bin/windows-${{ matrix.arch }}-noads.zip
          if-no-files-found: error

  release:
    name: Publish no-ads release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download no-ads artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: noads-windows-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
