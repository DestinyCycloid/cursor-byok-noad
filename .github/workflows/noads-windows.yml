name: Build no-ads Windows packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows amd64 no-ads package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler zip unzip pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          corepack enable
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build no-ads package
        run: task build:windows:amd64:noads

      - name: Verify package
        shell: bash
        run: |
          archive="bin/windows-64-noads.zip"
          test -s "$archive"
          unzip -l "$archive"
          rm -rf artifact
          mkdir -p artifact
          unzip -q "$archive" -d artifact
          test -s artifact/windows-64-noads.exe

      - name: Upload no-ads executable
        uses: actions/upload-artifact@v4
        with:
          name: noads-windows-amd64
          path: artifact/windows-64-noads.exe
          if-no-files-found: error

  release:
    name: Publish no-ads release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download no-ads executable
        uses: actions/download-artifact@v4
        with:
          name: noads-windows-amd64
          path: release-assets

      - name: Create release archive
        shell: bash
        run: zip -j release-assets/windows-64-noads.zip release-assets/windows-64-noads.exe

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
